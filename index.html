<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusTech - PEC-CS</title>
  <meta name="description" content="Pragati Engineering College Student Club Management System: unified digital platform for 35 official technical societies, Industry 4.0 clubs, event management, and accredited credentials.">
  <meta property="og:title" content="CampusTech - PEC-CS">
  <meta property="og:description" content="Pragati Engineering College Student Club Management System: unified digital platform for 35 official technical societies, Industry 4.0 clubs, event management, and accredited credentials.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <!-- Chart.js for Visual Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- QRCode.js for Dynamic QR Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Custom CSS for Card Holographics, Certificate Borders & Print -->
  <link rel="stylesheet" href="./css/custom.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white">
  
  <!-- SPA Mount Point -->
  <div id="app">
    <div class="min-h-screen flex items-center justify-center p-8 bg-slate-900 text-white">
      <div class="flex items-center space-x-3">
        <div class="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        <span class="text-sm font-semibold tracking-wide">Initializing CampusTech Ecosystem...</span>
      </div>
    </div>
  </div>
  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none max-w-sm w-full"></div>
  <!-- Application Bootstrap -->
  <script type="module" src="./js/app.js"></script>

</html>
